{% extends 'servicios.html' %}

{% block content %}
<!-- Form Section -->
<div class="col-md-8 p-0" style="margin-top: 21px;">
    <div class="card border-0 h-100">
        <div class="card-header bg-primary text-white text-left">
            <h2>Agregar Servicio</h2>
        </div>
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="form-group row">
                    <label for="nombre_del_servicio" class="col-md-4 col-form-label">Nombre del Servicio:</label>
                    <div class="col-md-8">
                        <input type="text" class="form-control" id="nombre_del_servicio" name="nombre_del_servicio" required>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="descripcion_del_servicio" class="col-md-4 col-form-label">Descripción del Servicio:</label>
                    <div class="col-md-8">
                        <textarea class="form-control" id="descripcion_del_servicio" name="descripcion_del_servicio"></textarea>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="duracion" class="col-md-4 col-form-label">Duración:</label>
                    <div class="col-md-8">
                        <input type="text" class="form-control" id="duracion" name="duracion">
                    </div>
                </div>
                <div class="form-group row">
                    <label for="precio_del_servicio" class="col-md-4 col-form-label">Precio del Servicio:</label>
                    <div class="col-md-8">
                        <input type="number" step="0.01" class="form-control" id="precio_del_servicio" name="precio_del_servicio" required>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="valor_sello" class="col-md-4 col-form-label">Valor Sello:</label>
                    <div class="col-md-8">
                        <input type="number" step="0.01" class="form-control" id="valor_sello" name="valor_sello" required>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="imagen" class="col-md-4 col-form-label">Imagen:</label>
                    <div class="col-md-8">
                        <input type="file" class="form-control" id="imagen" name="imagen">
                    </div>
                </div>
                <div class="card-footer bg-danger">
                    <div class="d-flex">
                        <div>
                            <button type="submit" class="btn btn-light btn-sm mr-2">Guardar</button>
                            <button type="button" class="btn btn-light btn-sm mr-2">Guardar y agregar nuevo</button>
                            <button type="button" class="btn btn-light btn-sm">Guardar y modificar</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
