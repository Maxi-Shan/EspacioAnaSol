{% extends "base.html" %}
{% block titulo %}Agregar Nuevo Servicio{% endblock %}

{% block contenido %} 
<div class="col-md-9 p-0" style="margin-top: 21px; min-height: 100vh; display: flex; flex-direction: column;">
    <div class="card border-0 flex-grow-1">
        <div class="card-header text-black text-left">
            <h2>Agregar Servicio</h2>
        </div>
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="form-group row">
                    <label for="nombre_del_servicio" class="col-md-4 col-form-label">Nombre del Servicio:</label>
                    <div class="col-md-8">
                        <input type="text" class="form-control" id="nombre_del_servicio" name="nombre_del_servicio" required>
                    </div>
                </div>
                
                <div class="form-group row">
                    <label for="descripcion_del_servicio" class="col-md-4 col-form-label">Descripción del Servicio:</label>
                    <div class="col-md-8">
                        <textarea rows="10" class="form-control" id="descripcion_del_servicio" name="descripcion_del_servicio"></textarea>
                    </div>
                </div>
                
                <div class="form-group row">
                    <label for="duracion" class="col-md-4 col-form-label">Duración:</label>
                    <div class="col-md-8">
                        <input type="text" class="form-control" id="duracion" name="duracion">
                    </div>
                </div>
                
                <div class="form-group row">
                    <label for="precio_del_servicio" class="col-md-4 col-form-label">Precio del Servicio:</label>
                    <div class="col-md-8">
                        <input type="number" step="0.01" class="form-control" id="precio_del_servicio" name="precio_del_servicio" required>
                    </div>
                </div>
                
                <div class="form-group row">
                    <label for="senia" class="col-md-4 col-form-label">Valor de Seña:</label>
                    <div class="col-md-8">
                        <input type="number" step="0.01" class="form-control" id="senia" name="senia" required>
                    </div>
                </div>
                
                <div class="form-group row">
                    <label for="imagen" class="col-md-4 col-form-label">Imagen:</label>
                    <div class="col-md-8">
                        <input type="file" class="form-control" id="imagen" name="imagen">
                    </div>
                </div>
            </div>

        <!-- Card Footer, siempre al final -->
        <div class="card-footer bg-danger d-flex pt-3">
            <button type="submit" class="btn btn-sm mr-2 text-white mx-2 mr-2" style="background-color: #701C7E;">Guardar</button>
            <a href="{% url 'list_servicios' %}" class="btn btn-warning btn-sm text-white ml-2">Cancelar</a>
        </div>
     </form>
    </div>
</div>
{% endblock %}
