{% extends 'servicios.html' %}
{% block content %}
<h2>Modificar Servicio</h2>

{% if servicio.imagen %}
    <p>Imagen actual:</p>
    <img src="{{ servicio.imagen.url }}" width="100" alt="Imagen del servicio">
{% else %}
    <p>Sin imagen actual.</p>
{% endif %}

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Guardar cambios</button>
</form>

<a href="{% url 'list_servicios' %}">Volver a la lista</a>
{% endblock %}
