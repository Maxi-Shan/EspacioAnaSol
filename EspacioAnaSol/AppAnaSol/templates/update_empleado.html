{% extends 'empleados.html' %}

{% block content %}
<div class="col-md-8 p-0" style="margin-top: 21px;">
    <div class="card border-0 h-100">
        <div class="card-header text-black text-left">
            <h2>Modificar Empleado</h2>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                
                <div class="form-group row">
                    <label for="dni" class="col-md-4 col-form-label">DNI:</label>
                    <div class="col-md-8">
                        <input type="number" class="form-control" id="dni" name="dni" value="{{ empleado.dni }}" readonly required>
                    </div>
                </div>

                <div class="form-group row">
                    <label for="nombre" class="col-md-4 col-form-label">Nombre:</label>
                    <div class="col-md-8">
                        <input type="text" class="form-control" id="nombre" name="nombre" value="{{ empleado.nombre }}" required>
                    </div>
                </div>

                <div class="form-group row">
                    <label for="apellido" class="col-md-4 col-form-label">Apellido:</label>
                    <div class="col-md-8">
                        <input type="text" class="form-control" id="apellido" name="apellido" value="{{ empleado.apellido }}" required>
                    </div>
                </div>

                <div class="form-group row">
                    <label for="domicilio" class="col-md-4 col-form-label">Domicilio:</label>
                    <div class="col-md-8">
                        <input type="text" class="form-control" id="domicilio" name="domicilio" value="{{ empleado.domicilio }}">
                    </div>
                </div>

                <div class="form-group row">
                    <label for="correo_electronico" class="col-md-4 col-form-label">Correo Electrónico:</label>
                    <div class="col-md-8">
                        <input type="email" class="form-control" id="correo_electronico" name="correo_electronico" value="{{ empleado.correo_electronico }}">
                    </div>
                </div>

                <div class="form-group row">
                    <label for="numero_telefono" class="col-md-4 col-form-label">Número de Teléfono:</label>
                    <div class="col-md-8">
                        <input type="tel" class="form-control" id="numero_telefono" name="numero_telefono" value="{{ empleado.numero_telefono }}">
                    </div>
                </div>

                <div class="form-group row">
                    <label for="estado_empleado" class="col-md-4 col-form-label">Estado del Empleado:</label>
                    <div class="col-md-8">
                        <select class="form-control" id="estado_empleado" name="estado_empleado">
                            <option value="activo" {% if empleado.estado_empleado == 'activo' %}selected{% endif %}>Activo</option>
                            <option value="inactivo" {% if empleado.estado_empleado == 'inactivo' %}selected{% endif %}>Inactivo</option>
                        </select>
                    </div>
                </div>

                <div class="form-group row">
                    <label for="es_admin" class="col-md-4 col-form-label">¿Es Admin?</label>
                    <div class="col-md-8">
                        <input type="checkbox" id="es_admin" name="es_admin" {% if empleado.es_admin %}checked{% endif %}>
                    </div>
                </div>

                <div class="card-footer bg-danger">
                    <button type="submit" class="btn btn-sm mr-2 text-white" style="background-color: #701C7E;">Guardar</button>
                    <button type="button" class="btn btn-sm mr-2 text-white" style="background-color: #A964BF;">Guardar y agregar nuevo</button>
                    <button type="button" class="btn btn-sm text-white" style="background-color: #A964BF;">Guardar y modificar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
