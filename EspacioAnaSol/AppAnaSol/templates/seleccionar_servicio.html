<!DOCTYPE html>
<html lang="es">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleccionar Servicios</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{% static 'css/style2.css' %}">
</head>
<body>
    <!-- Primary Header -->
    <header class="header-primary">
        <div class="logo">
            <a href="{% url 'pagina_principal' %}">
                <img src="{% static 'imagenes/icono1.png' %}" alt="Logo">
            </a>
            <span>EspacioAnaSol</span>
        </div>
        <div class="welcome-text">
            Bienvenido, <strong>Usuario</strong> / <a href="#">Ver el Sitio</a> / <a href="{% url 'logout' %}">Cerrar Sesión</a>
        </div>
    </header>
    
    <!-- Secondary Header -->
    <header class="header-secondary">
        <div class="menu-text">
            <a href="{% url 'pagina_principal' %}">Inicio </a> / <a href="{% url 'list_servicios' %}">Servicios</a>
        </div>
    </header>

    <!-- Main content -->
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-4 sidebar">
                <h3>Sitio de Empleados</h3>
                <div class="menu-section">
                    <h4>Registro de Datos</h4>
                    <div class="menu-item"><a href="#">Ventas</a></div>
                    <div class="menu-item"><a href="{% url 'list_cajas' %}">Caja</a></div>
                    <div class="menu-item"><a href="{% url 'list_turnos' %}">Turnos</a></div>
                    <div class="menu-item"><a href="{% url 'list_servicios' %}">Servicios</a></div>
                </div>
            </div>

            <div class="col-md-8 p-0" style="margin-top: 21px;">
                <div class="card border-0 h-100">
                    <div class="card-header text-black text-left">
                        <h2>Seleccionar Servicios</h2>
                    </div>
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <div class="card-footer bg-danger">
                                <button type="submit" class="btn btn-sm mr-2 text-white" style="background-color: #701C7E;">Guardar</button>
                                <button type="button" class="btn btn-sm mr-2 text-white" style="background-color: #A964BF;">Guardar y agregar nuevo</button>
                                <button type="button" class="btn btn-sm text-white" style="background-color: #A964BF;">Guardar y modificar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
