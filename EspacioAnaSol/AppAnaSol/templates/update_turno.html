{% extends 'turnos3.html' %}

{% block content %}
<!-- Form Section -->
<div class="col-md-8 p-0" style="margin-top: 21px;">
    <div class="card border-0 h-100">
        <div class="card-header text-black text-left">
            <h2>Modificar Turno</h2>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}

                <div class="form-group row">
                    <label for="fecha" class="col-md-4 col-form-label">Fecha:</label>
                    <div class="col-md-8">
                        <input type="date" name="fecha" id="fecha" value="{{ turno.fecha|date:'Y-m-d' }}" class="form-control">
                    </div>
                </div>

                <div class="form-group row">
                    <label for="hora" class="col-md-4 col-form-label">Hora:</label>
                    <div class="col-md-8">
                        <input type="time" name="hora" id="hora" value="{{ turno.hora|time:'H:i' }}" class="form-control">
                    </div>
                </div>

                <div class="form-group row">
                    <label for="estado_turno" class="col-md-4 col-form-label">Estado:</label>
                    <div class="col-md-8">
                        <select name="estado_turno" id="estado_turno" class="form-control">
                            <option value="Disponible" {% if turno.estado_turno == 'Cisponible' %} selected {% endif %}>Disponible</option>
                            <option value="Pendiente" {% if turno.estado_turno == 'Cendiente' %} selected {% endif %}>Pendiente</option>
                            <option value="Confirmado" {% if turno.estado_turno == 'Confirmado' %} selected {% endif %}>Confirmado</option>
                            <option value="Cancelado" {% if turno.estado_turno == 'Cancelado' %} selected {% endif %}>Cancelado</option>
                        </select>
                    </div>
                </div>

                <div class="card-footer bg-danger">
                    <button type="submit" class="btn btn-sm mr-2 text-white" style="background-color: #701C7E;">Guardar</button>
                    <a href="{% url 'list_turnos' %}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
