{% extends 'caja.html' %}

{% block content %}
<h2>Modificar Caja: {{ caja.id_caja }}</h2>
<form method="POST">
    {% csrf_token %}
    <label for="monto_inicial">Monto Inicial:</label>
    <input type="text" name="monto_inicial" value="{{ caja.monto_inicial }}" required>
    <button type="submit">Guardar Cambios</button>
</form>
{% endblock %}
