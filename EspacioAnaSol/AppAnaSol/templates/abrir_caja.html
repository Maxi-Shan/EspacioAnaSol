{% extends 'caja.html' %}
{% load static %}
{% block content %}
             <!-- Form Section -->
             <div class="col-md-8 p-0" style="margin-top: 21px;">
                <div class="card border-0 h-100">
                    <div class="card-header text-black text-left">
                        <h2>Abrir Caja</h2>
                    </div>
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            <div class="form-group">
                                <label for="monto_inicial">Monto Inicial:</label>
                                <input type="number" step="0.01" name="monto_inicial" id="monto_inicial" class="form-control" required>
                            </div>
                            {% if error %}
                                <p class="text-danger">{{ error }}</p>
                            {% endif %}
                    </div>

                    <!-- Action Buttons Toolbar -->
                    <div class="card-footer bg-danger">
                        <div class="d-flex">
                            <div>
                                <button type="submit" class="btn btn-light btn-sm mr-2">Guardar</button>
                                <button type="button" class="btn btn-light btn-sm mr-2">Cancelar</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
{% endblock %}
