{% extends 'caja.html' %}

{% block content %}
<h2>Abrir Caja</h2>
<form method="post">
    {% csrf_token %}
    <label for="monto_inicial">Monto Inicial:</label>
    <input type="number" step="0.01" name="monto_inicial" required>
    <button type="submit">Abrir Caja</button>
</form>


{% if error %}
    <p style="color: red;">{{ error }}</p>
{% endif %}
{% endblock %}
