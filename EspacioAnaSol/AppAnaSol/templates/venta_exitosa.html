<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venta Exitosa</title>
    <style>
        /* Estilos para centrar el contenedor */
        body, html {
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #C16AA8;
        }
        
        /* Estilos para el cartel */
        .card {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            padding: 30px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            margin: 20px;
        }
        
        .card h3 {
            color: #000000;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .card p {
            font-size: 18px;
            color: #555;
            margin-bottom: 20px;
        }
        
        .card a {
            display: inline-block;
            text-decoration: none;
            color: #ffffff;
            background-color: #007bff;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        
        .card a:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="card">
        <h3>¡Venta registrada con éxito!</h3>
        <p>¡Gracias por su compra!</p>
        <a href="{% url 'list_ventas' %}">Volver al inicio</a>
    </div>
</body>
</html>
