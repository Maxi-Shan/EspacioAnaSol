{% extends 'caja.html' %}

{% block content %}
<!-- Form Section -->
<div class="col-md-8 p-0" style="margin-top: 21px;">
    <div class="card border-0 h-100">
        <div class="card-header text-black text-left">
            <h2>Modificar Caja</h2>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="form-group row">
                    <label for="monto_inicial" class="col-md-4 col-form-label">Monto Inicial:</label>
                    <div class="col-md-8">
                        <input type="text" name="monto_inicial" id="monto_inicial" class="form-control" value="{{ caja.monto_inicial }}" required>
                    </div>
                </div>

                <!-- Aquí puedes agregar otros campos que necesites modificar -->
                
                <div class="card-footer bg-danger" style="margin-top: 300px;">
                    <button type="submit" class="btn btn-sm mr-2 text-white" style="background-color: #701C7E;">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
