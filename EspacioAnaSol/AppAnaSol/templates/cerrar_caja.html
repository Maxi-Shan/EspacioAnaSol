{% extends 'caja.html' %}

{% block content %}
<h2>Cerrar Caja {{ caja.id_caja }}</h2>
    <form method="POST">
        {% csrf_token %}
        <label for="monto_recaudado">Monto Recaudado:</label>
        <input type="number" name="monto_recaudado" step="0.01" required>
        <button type="submit">Cerrar Caja</button>
    </form>
{% endblock %}
