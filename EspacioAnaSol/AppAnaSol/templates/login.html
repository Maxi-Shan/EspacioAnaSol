<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/boxicons/css/boxicons.min.css" rel="stylesheet">
    <title>Iniciar Sesión - Empleados</title>
    <style>
        body {
            background-image: url("{% static 'imagenes/fondo.png' %}");
            background-repeat: no-repeat;
            background-size: cover;
            height: 100vh;
        }
        .padre {
            background-color: #ffffff;
            border: 2px solid #8b2ea8;
            border-radius: 50px;
            padding: 20px;
            max-width: 800px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        .texto {
            font-weight: bold;
            color: #b033bb;
            font-size: 50px;
        }
        .input-group-text {
            background-color: #8b2ea8;
            color: white;
            border: none;
            width: 50px; /* Uniform width for icons */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .bx {
            font-size: 20px; /* Adjust icon size */
        }
        .btn-custom {
            width: 150px;
            padding: 10px;
            background-color: #a964bf;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
        }
        .btn-custom:hover {
            background-color: #8b2ea8;
        }
        .error-message {
            color: red;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body class="d-flex justify-content-center align-items-center">
    <div class="padre container p-4">
        <div class="row g-4 align-items-center">
            <div class="col-lg-6 text-center">
                <img src="{% static 'imagenes/Logo1.png' %}" alt="Logotipo" class="img-fluid" style="max-height: 300px;">
            </div>
            <div class="col-lg-6">
                <h3 class="texto text-center mb-4">Iniciar Sesión</h3>
                <form id="loginForm" method="POST" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bx bx-user"></i>
                            </span>
                            <input type="number" id="dni" name="dni" class="form-control" placeholder="Ingrese su DNI">
                        </div>
                        {% if dni_error %}
                            <div id="dniError" class="error-message">{{ dni_error }}</div>
                        {% endif %}
                    </div>
                    <div class="mb-3">
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bx bx-lock"></i>
                            </span>
                            <input type="password" id="contraseña" name="contraseña" class="form-control" placeholder="Ingrese su contraseña">
                        </div>
                        {% if contraseña_error %}
                            <div id="contraseñaError" class="error-message">{{ contraseña_error }}</div>
                        {% endif %}
                    </div>
                    
                    <div class="d-flex justify-content-end">
                        <button type="submit" class="btn btn-custom">Acceder</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script>

document.getElementById('loginForm').addEventListener('submit', function(event) {
    let isValid = true;

    // Validar DNI
    const dni = document.getElementById('dni').value;
    const dniError = document.getElementById('dniError');
    dniError.textContent = '';
    if (dni.length < 7 || dni.length > 8 || isNaN(dni)) {
        dniError.textContent = 'El DNI debe tener entre 7 y 8 dígitos.';
        isValid = false;
    }

    // Validar contraseña
    const contraseña = document.getElementById('contraseña').value;
    const contraseñaError = document.getElementById('contraseñaError');
    contraseñaError.textContent = '';
    if (contraseña.trim() === '') {
        contraseñaError.textContent = 'La contraseña no puede estar vacía.';
        isValid = false;
    }

    // Si hay errores, prevenir envío del formulario
    if (!isValid) {
        event.preventDefault();
    }
});
        
   </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
