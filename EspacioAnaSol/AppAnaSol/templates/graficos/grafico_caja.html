{% extends "index.html" %}

{% block titulo %} grafico caja {% endblock %}

{% block contenido %} 

<h1>Gráfico de Caja por Empleado</h1>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<canvas id="cajaChart" width="400" height="200"></canvas>

    <script>
        // Datos renderizados directamente desde el servidor
        const empleados = {{ empleados|safe }}; // Lista de empleados pasada como contexto
        const montos = {{ montos|safe }};       // Lista de montos pasada como contexto

        // Crear el gráfico con Chart.js
        const ctx = document.getElementById('cajaChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: empleados, // Etiquetas de las barras (empleados)
                datasets: [{
                    label: 'Monto Recaudado ($)', // Título del gráfico
                    data: montos, // Datos (montos recaudados)
                    backgroundColor: 'rgba(54, 162, 235, 0.2)', // Color de las barras
                    borderColor: 'rgba(54, 162, 235, 1)',       // Color del borde
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true // Comenzar desde 0 en el eje Y
                    }
                }
            }
        });
    </script>



{% endblock %}
