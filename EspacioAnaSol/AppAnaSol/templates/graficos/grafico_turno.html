{% extends "index.html" %}

{% block titulo %} Grafico De Turno {% endblock %}

{% block contenido %} 
<h1>Grafico de Turnos</h1>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<canvas id="turnoChart" width="400" height="200"></canvas>

<script>
    const ctx = document.getElementById('turnoChart').getContext('2d');
    
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: {{ labels|safe }}, // Rendered dynamically from Django
            datasets: [{
                label: 'Turnos por Servicio',
                data: {{ data|safe }}, // Rendered dynamically from Django
                backgroundColor: Array({{ labels|length }}).fill('rgba(253, 157, 255, 0.8)'),
                borderColor: Array({{ labels|length }}).fill('rgba(75, 192, 192, 1)'),
                borderWidth: 1
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });
</script> 
{% endblock %}
