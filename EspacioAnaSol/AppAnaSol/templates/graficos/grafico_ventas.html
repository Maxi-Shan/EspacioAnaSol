{% extends "base.html" %}
{% block titulo %}Grafico de Venta{% endblock %}

{% block contenido %} 
<div class="col-md-9 p-0" style="margin-top: 21px;">
    <div class="card border-0 h-100">
        <div class="card-header text-black text-left">
            <h1>grafico ventas</h1>
        </div>
        <div class="card-body">
          <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
          <canvas id="cantidadVentasChart" width="400" height="200"></canvas>
          <script>
            const ctx = document.getElementById('cantidadVentasChart').getContext('2d');
            const cantidadVentasChart = new Chart(ctx, {
                type: 'bar', // Puedes cambiar a 'pie', 'doughnut', etc.
                data: {
                    labels: {{ labels|safe }}, // Métodos de pago
                    datasets: [{
                        label: 'Cantidad de Ventas',
                        data: {{ data|safe }}, // Cantidad de ventas por método de pago
                        backgroundColor: [
                            'rgba(54, 162, 235, 0.2)',
                            'rgba(255, 99, 132, 0.2)',
                            'rgba(255, 206, 86, 0.2)',
                            'rgba(75, 192, 192, 0.2)',
                            'rgba(153, 102, 255, 0.2)',
                            'rgba(255, 159, 64, 0.2)'
                        ],
                        borderColor: [
                            'rgba(54, 162, 235, 1)',
                            'rgba(255, 99, 132, 1)',
                            'rgba(255, 206, 86, 1)',
                            'rgba(75, 192, 192, 1)',
                            'rgba(153, 102, 255, 1)',
                            'rgba(255, 159, 64, 1)'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'top',
                        },
                        title: {
                            display: true,
                            text: 'Cantidad de Ventas por Método de Pago'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
          </script>
        </div>
    </div>
</div>  
{% endblock %}
