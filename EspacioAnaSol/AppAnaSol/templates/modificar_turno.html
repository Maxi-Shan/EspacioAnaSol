{% extends "base.html" %}
{% load static %}

{% block titulo %}Modificar Turno{% endblock %}

{% block contenido %}
<div class="col-md-9 p-0" style="margin-top: 21px; min-height: 100vh; display: flex; flex-direction: column;">
    <div class="card border-0 flex-grow-1">
        <div class="card-header text-black text-left">
            <h2>Modificar Turno</h2>
        </div>
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="form-group row">
                    <label for="empleado" class="col-md-4 col-form-label">Empleado:</label>
                    <div class="col-md-8">
                        <select class="form-control" name="empleado" id="empleado">
                            {% for empleado in empleados %}
                                <option value="{{ empleado.id }}" {% if empleado.id == turno.id_empleado.id %}selected{% endif %}>{{ empleado.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
        </div>
        <!-- Card Footer, siempre al final -->
        <div class="card-footer bg-danger d-flex pt-3">
            <button type="submit" class="btn btn-sm text-white mx-2 mr-2" style="background-color: #701C7E;">Actualizar</button>
            <a href="{% url 'list_turnos' %}" class="btn btn-warning btn-sm text-white ml-2">Cancelar</a>
        </div>
    </form>
    </div>
</div>
{% endblock %}
