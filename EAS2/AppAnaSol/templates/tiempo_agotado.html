{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiempo Agotado</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Prevenir volver atrás en el navegador
        history.pushState(null, document.title, location.href);
        window.addEventListener('popstate', function () {
            history.pushState(null, document.title, location.href);
        });
    </script>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <!-- Botón Volver -->
    <div class="position-absolute top-0 start-0 m-3">
        <a href="{% url 'inicio' %}" class="btn btn-outline-primary">Volver</a>
    </div>

    <!-- Aviso -->
    <div class="card text-center" style="max-width: 600px; border: none; background: linear-gradient(135deg, #e0b2d7, #f8d8e7, #fff);">
        <div class="card-body">
            <h1 class="card-title text-purple fw-bold">Aviso</h1>
            <p class="card-text fs-4">
                ¡Ups! El tiempo para subir el comprobante de seña se ha acabado. No te preocupes, puedes intentarlo de nuevo.
            </p>
        </div>
    </div>

</body>
</html>
